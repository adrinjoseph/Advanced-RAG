version: 2

updates:
  # Python dependencies (uv / pip ecosystem)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    reviewers:
      - adrinjoseph
    labels:
      - dependencies
      - python
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Only update patch versions for these until manually reviewed
      - dependency-name: sqlalchemy
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: alembic
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    reviewers:
      - adrinjoseph
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope

  # Docker base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    reviewers:
      - adrinjoseph
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope