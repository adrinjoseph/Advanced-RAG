<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Advanced-RAG architecture diagram</title>
<desc>Pipeline flow from user through ingestion and query paths to LLM response</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .node { rx: 10; }
    .label-main { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1F2937; }
    .label-sub  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 400; fill: #6B7280; }
    .label-section { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #9CA3AF; letter-spacing: 0.08em; }
    .edge       { fill: none; stroke: #D1D5DB; stroke-width: 1.5; marker-end: url(#arr); }
    .edge-accent{ fill: none; stroke: #8B5CF6; stroke-width: 1.5; stroke-dasharray: 5 3; marker-end: url(#arr-accent); }
    .edge-teal  { fill: none; stroke: #0D9488; stroke-width: 1.5; marker-end: url(#arr-teal); }
    .edge-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #9CA3AF; }

    /* pulse animation on key nodes */
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.65; }
    }
    @keyframes flow {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -24; }
    }
    @keyframes fadeup {
      0%   { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .anim-pulse  { animation: pulse 2.8s ease-in-out infinite; }
    .anim-flow   { stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; }
    .anim-flow-slow { stroke-dasharray: 6 4; animation: flow 2.2s linear infinite; }
    .anim-fadein { animation: fadeup 0.6s ease-out both; }

    /* dark mode overrides */
    @media (prefers-color-scheme: dark) {
      .label-main    { fill: #F3F4F6; }
      .label-sub     { fill: #9CA3AF; }
      .label-section { fill: #6B7280; }
      .edge          { stroke: #374151; }
      .edge-label    { fill: #6B7280; }
    }
  </style>
</defs>

<!-- ─── background sections ─── -->
<!-- Azure infra band -->
<rect x="12" y="12" width="876" height="596" rx="16" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="6 4"/>
<text class="label-section" x="30" y="34">AZURE VM — DOCKER COMPOSE</text>

<!-- Ingestion band -->
<rect x="30" y="44" width="260" height="560" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
<text class="label-section" x="46" y="66" fill="#16A34A">INGESTION PIPELINE</text>

<!-- Query band -->
<rect x="310" y="44" width="560" height="560" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
<text class="label-section" x="326" y="66" fill="#7C3AED">QUERY PIPELINE</text>

<!-- ─── INGESTION NODES ─── -->
<!-- Upload -->
<rect class="node anim-fadein" x="60" y="80" width="200" height="52" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" style="animation-delay:0s"/>
<text class="label-main" x="160" y="102" text-anchor="middle">PDF Upload</text>
<text class="label-sub"  x="160" y="118" text-anchor="middle">validate · magic bytes · size · pages</text>

<!-- Dedup -->
<rect class="node anim-fadein" x="60" y="156" width="200" height="52" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" style="animation-delay:0.1s"/>
<text class="label-main" x="160" y="178" text-anchor="middle">SHA-256 dedupe</text>
<text class="label-sub"  x="160" y="194" text-anchor="middle">UNIQUE(collection_id, sha256)</text>

<!-- Extract -->
<rect class="node anim-fadein" x="60" y="232" width="200" height="52" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" style="animation-delay:0.2s"/>
<text class="label-main" x="160" y="254" text-anchor="middle">PyMuPDF extract</text>
<text class="label-sub"  x="160" y="270" text-anchor="middle">text blocks + page provenance</text>

<!-- Chunk -->
<rect class="node anim-fadein" x="60" y="308" width="200" height="52" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" style="animation-delay:0.3s"/>
<text class="label-main" x="160" y="330" text-anchor="middle">Chunker</text>
<text class="label-sub"  x="160" y="346" text-anchor="middle">~450 tok · 50 overlap · recursive</text>

<!-- Embed doc -->
<rect class="node anim-fadein anim-pulse" x="60" y="384" width="200" height="52" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2" style="animation-delay:0.4s"/>
<text class="label-main" x="160" y="406" text-anchor="middle">ONNX embed (doc)</text>
<text class="label-sub"  x="160" y="422" text-anchor="middle">bge-small-en · 384-dim · Semaphore(1)</text>

<!-- ParadeDB -->
<rect class="node anim-fadein" x="60" y="460" width="200" height="72" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="2" style="animation-delay:0.5s"/>
<text class="label-main" x="160" y="484" text-anchor="middle">ParadeDB</text>
<text class="label-sub"  x="160" y="500" text-anchor="middle">pgvector HNSW (cosine)</text>
<text class="label-sub"  x="160" y="516" text-anchor="middle">pg_search BM25 · btree(collection_id)</text>
<text class="label-sub"  x="160" y="532" text-anchor="middle">internal network only</text>

<!-- ingestion flow arrows -->
<line class="edge anim-flow" x1="160" y1="132" x2="160" y2="156"/>
<line class="edge anim-flow" x1="160" y1="208" x2="160" y2="232"/>
<line class="edge anim-flow" x1="160" y1="284" x2="160" y2="308"/>
<line class="edge anim-flow" x1="160" y1="360" x2="160" y2="384"/>
<line class="edge anim-flow" x1="160" y1="436" x2="160" y2="460"/>

<!-- ─── QUERY NODES ─── -->
<!-- User / Chainlit -->
<rect class="node anim-fadein" x="590" y="80" width="200" height="52" rx="10" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5" style="animation-delay:0.1s"/>
<text class="label-main" x="690" y="102" text-anchor="middle">Chainlit UI</text>
<text class="label-sub"  x="690" y="118" text-anchor="middle">HTTP client only · zero business logic</text>

<!-- Auth -->
<rect class="node anim-fadein" x="590" y="156" width="200" height="52" rx="10" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5" style="animation-delay:0.15s"/>
<text class="label-main" x="690" y="178" text-anchor="middle">Auth + guardrail (input)</text>
<text class="label-sub"  x="690" y="194" text-anchor="middle">token · owner · length · inject signal</text>

<!-- Embed query -->
<rect class="node anim-fadein anim-pulse" x="590" y="232" width="200" height="52" rx="10" fill="#DDD6FE" stroke="#8B5CF6" stroke-width="2" style="animation-delay:0.2s;animation-delay:0.2s,1.4s"/>
<text class="label-main" x="690" y="254" text-anchor="middle">ONNX embed (query)</text>
<text class="label-sub"  x="690" y="270" text-anchor="middle">bge query prefix prepended here</text>

<!-- Dense retrieval -->
<rect class="node anim-fadein" x="470" y="318" width="180" height="62" rx="10" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5" style="animation-delay:0.3s"/>
<text class="label-main" x="560" y="340" text-anchor="middle">Dense retrieval</text>
<text class="label-sub"  x="560" y="356" text-anchor="middle">pgvector HNSW top-20</text>
<text class="label-sub"  x="560" y="370" text-anchor="middle">filtered: collection + owner</text>

<!-- BM25 retrieval -->
<rect class="node anim-fadein" x="720" y="318" width="180" height="62" rx="10" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5" style="animation-delay:0.35s"/>
<text class="label-main" x="810" y="340" text-anchor="middle">BM25 retrieval</text>
<text class="label-sub"  x="810" y="356" text-anchor="middle">pg_search real BM25 top-20</text>
<text class="label-sub"  x="810" y="370" text-anchor="middle">sequential (not concurrent)</text>

<!-- RRF -->
<rect class="node anim-fadein anim-pulse" x="590" y="410" width="200" height="52" rx="10" fill="#DDD6FE" stroke="#8B5CF6" stroke-width="2" style="animation-delay:0.4s"/>
<text class="label-main" x="690" y="432" text-anchor="middle">RRF fusion</text>
<text class="label-sub"  x="690" y="448" text-anchor="middle">1/(k+rank) · k=60 · pure function</text>

<!-- Context builder -->
<rect class="node anim-fadein" x="590" y="486" width="200" height="52" rx="10" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5" style="animation-delay:0.45s"/>
<text class="label-main" x="690" y="508" text-anchor="middle">Context builder</text>
<text class="label-sub"  x="690" y="524" text-anchor="middle">top-8 · token budget · dedup</text>

<!-- Groq LLM -->
<rect class="node anim-fadein" x="590" y="558" width="200" height="52" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5" style="animation-delay:0.5s"/>
<text class="label-main" x="690" y="580" text-anchor="middle">Groq LLM</text>
<text class="label-sub"  x="690" y="596" text-anchor="middle">structured JSON · cite + abstain</text>

<!-- query flow arrows -->
<line class="edge-accent anim-flow" x1="690" y1="132" x2="690" y2="156"/>
<line class="edge-accent anim-flow" x1="690" y1="208" x2="690" y2="232"/>

<!-- embed → dense and BM25 -->
<path class="edge-accent anim-flow-slow" d="M660 284 Q590 302 560 318" marker-end="url(#arr-accent)"/>
<path class="edge-accent anim-flow-slow" d="M720 284 Q790 302 810 318" marker-end="url(#arr-accent)"/>

<!-- dense + BM25 → RRF -->
<path class="edge-accent anim-flow-slow" d="M560 380 Q590 400 640 410" marker-end="url(#arr-accent)"/>
<path class="edge-accent anim-flow-slow" d="M810 380 Q790 400 740 410" marker-end="url(#arr-accent)"/>

<line class="edge-accent anim-flow" x1="690" y1="462" x2="690" y2="486"/>
<line class="edge-accent anim-flow" x1="690" y1="538" x2="690" y2="558"/>

<!-- ParadeDB shared by both pipelines -->
<path class="edge-teal anim-flow-slow" d="M160 532 Q240 560 440 500 Q520 480 470 390 Q460 365 470 349" marker-end="url(#arr-teal)"/>
<text class="edge-label" x="280" y="558">shared DB</text>
<path class="edge-teal anim-flow-slow" d="M260 500 Q350 530 465 400" marker-end="url(#arr-teal)"/>

<!-- ─── LEGEND ─── -->
<rect x="30" y="574" width="10" height="10" rx="2" fill="#86EFAC"/>
<text class="label-sub" x="46" y="583">Ingestion</text>
<rect x="110" y="574" width="10" height="10" rx="2" fill="#A78BFA"/>
<text class="label-sub" x="126" y="583">Query pipeline</text>
<rect x="230" y="574" width="10" height="10" rx="2" fill="#34D399"/>
<text class="label-sub" x="246" y="583">Database</text>
<rect x="316" y="574" width="10" height="10" rx="2" fill="#FCD34D"/>
<text class="label-sub" x="332" y="583">External LLM</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
